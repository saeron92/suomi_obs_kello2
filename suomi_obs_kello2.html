<!doctype html>
<html lang="fi">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Suomi OBS -kello</title>

<!-- Orbitron -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', sans-serif;
  color: white;

  animation: pageIn .8s ease-out both;
}

.clock {
  text-align: center;
  line-height: 1;

  filter:
    drop-shadow(0 3px 3px rgba(0,0,0,.9))
    drop-shadow(0 8px 18px rgba(0,0,0,.75));

  animation: glow 4s ease-in-out infinite;
}


/* ==============================
   AIKA
   ============================== */

.time {
  font-family: 'Orbitron', sans-serif;

  font-size: 76px;
  font-weight: 700;

  letter-spacing: 3px;

  font-variant-numeric: tabular-nums;

  white-space: nowrap;
}


/* Tunnit ja minuutit */

.hours,
.minutes {
  color: #8fe7ff;

  text-shadow:
    0 2px 2px rgba(0,0,0,.95),
    0 4px 10px rgba(0,0,0,.85),
    0 0 8px rgba(80,210,255,.8),
    0 0 22px rgba(80,210,255,.45);
}


/* ==============================
   KAKSOISPISTE / HEARTBEAT
   ============================== */

.colon {
  display: inline-block;

  color: #d5b8ff;

  text-shadow:
    0 0 6px rgba(180,120,255,.75),
    0 0 14px rgba(180,120,255,.45),
    0 0 28px rgba(140,90,255,.25);

  animation: heartbeat 1.6s ease-in-out infinite;
}


/*
   Rauhallinen syke:

   näkyy
   ↓
   feidaa kokonaan pois
   ↓
   pieni tauko
   ↓
   feidaa hitaasti takaisin
   ↓
   pieni tauko
   ↓
   uudestaan
*/

@keyframes heartbeat {

  0% {
    opacity: 1;
  }

  35% {
    opacity: 0;
  }

  50% {
    opacity: 0;
  }

  80% {
    opacity: 1;
  }

  100% {
    opacity: 1;
  }

}


/* ==============================
   PÄIVÄMÄÄRÄ
   ============================== */

.date {
  margin-top: 14px;

  font-family: 'Orbitron', sans-serif;

  font-size: 27px;
  font-weight: 600;

  letter-spacing: 2px;

  color: #d5b8ff;

  opacity: .95;

  text-shadow:
    0 2px 3px rgba(0,0,0,.9),
    0 5px 12px rgba(0,0,0,.65),
    0 0 10px rgba(180,120,255,.4);
}


/* ==============================
   KOKO KELLON HENTO GLOW
   ============================== */

@keyframes glow {

  0%, 100% {
    filter:
      drop-shadow(0 3px 3px rgba(0,0,0,.9))
      drop-shadow(0 8px 18px rgba(0,0,0,.75));
  }

  50% {
    filter:
      drop-shadow(0 3px 3px rgba(0,0,0,.9))
      drop-shadow(0 8px 22px rgba(0,0,0,.8))
      drop-shadow(0 0 8px rgba(80,210,255,.15));
  }

}


/* ==============================
   KÄYNNISTYSANIMAATIO
   ============================== */

@keyframes pageIn {

  from {
    opacity: 0;
    transform: translateY(8px) scale(.97);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

}


/* ==============================
   PIENEMMÄT NÄYTÖT
   ============================== */

@media (max-width: 600px) {

  .time {
    font-size: 56px;
  }

  .date {
    font-size: 21px;
  }

}

</style>

</head>

<body>

<div class="clock">

  <div class="time">
    <span class="hours" id="hours"></span><span class="colon">:</span><span class="minutes" id="minutes"></span>
  </div>

  <div class="date" id="date"></div>

</div>


<script>

const hoursEl = document.getElementById('hours');
const minutesEl = document.getElementById('minutes');
const dateEl = document.getElementById('date');

const pad = n => String(n).padStart(2, '0');

const weekdays = {
  Monday: 'MAANANTAI',
  Tuesday: 'TIISTAI',
  Wednesday: 'KESKIVIIKKO',
  Thursday: 'TORSTAI',
  Friday: 'PERJANTAI',
  Saturday: 'LAUANTAI',
  Sunday: 'SUNNUNTAI'
};


function updateClock() {

  const parts = new Intl.DateTimeFormat('en-GB', {

    timeZone: 'Europe/Helsinki',

    weekday: 'long',

    day: '2-digit',
    month: '2-digit',
    year: 'numeric',

    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',

    hourCycle: 'h23'

  }).formatToParts(new Date());


  const p = {};

  for (const x of parts) {
    p[x.type] = x.value;
  }


  hoursEl.textContent =
    pad(p.hour);

  minutesEl.textContent =
    pad(p.minute);

  dateEl.textContent =
    `${weekdays[p.weekday]} ${p.day}.${p.month}.${p.year}`;

}


updateClock();

setInterval(updateClock, 250);

</script>

</body>

</html>
