<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suomi OBS -kello</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{display:flex;align-items:center;justify-content:center;font-family:Inter,Arial,Helvetica,sans-serif;color:white}
.clock{text-align:center;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.75)}
.date{font-size:30px;font-weight:700;letter-spacing:1.5px;margin-top:12px}
.time{font-size:72px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div>
<script>
const dateEl=document.getElementById('date'),timeEl=document.getElementById('time');
const pad=n=>String(n).padStart(2,'0');
const weekdays={Monday:'MAANANTAI',Tuesday:'TIISTAI',Wednesday:'KESKIVIIKKO',Thursday:'TORSTAI',Friday:'PERJANTAI',Saturday:'LAUANTAI',Sunday:'SUNNUNTAI'};
function updateClock(){
  const a=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Helsinki',weekday:'long',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const p={}; for(const x of a)p[x.type]=x.value;
  dateEl.textContent=`${weekdays[p.weekday]} ${p.day}.${p.month}.${p.year}`;
  timeEl.textContent=`${pad(p.hour)}:${pad(p.minute)}`;
}
updateClock();setInterval(updateClock,250);
</script>
</body>
</html>
